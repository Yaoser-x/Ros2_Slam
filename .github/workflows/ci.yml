name: ROS2 CI

on:
  push:
    branches: [main, ARM]
  pull_request:
    branches: [main, ARM]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout firmware contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Yaoser-x/SlamRobot_Chassis_Control
          ref: bc472cc874e930aaed6eb8e7de73b41a2563dd85
          path: firmware-contract

      - name: Configure git safe directory
        run: git config --global --add safe.directory /__w/Ros2_Slam/Ros2_Slam

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y python3-pip python3-serial python3-jsonschema shellcheck
          pip3 install \
            "pytest<8" pytest-cov \
            black==24.10.0 ruff==0.8.6 mypy==1.14.1 yamllint==1.35.1

      - name: rosdep install
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y \
            --skip-keys ydlidar_sdk --skip-keys ydlidar_ros2_driver

      - name: Static quality gates
        run: |
          ruff check .
          black --check \
            tools/datasets tools/experiments verification/runners scripts/verify tests/integration \
            tests/deployment/test_coverage_gate.py \
            tests/deployment/test_release_contract.py \
            src/robot_chassis_model/robot_chassis_model \
            src/robot_chassis_ops/robot_chassis_ops \
            src/robot_control/robot_control/control_policy.py \
            src/robot_config/robot_config \
            src/robot_navigation_guard/robot_navigation_guard \
            src/robot_state_estimation/robot_state_estimation \
            src/robot_supervision/robot_supervision \
            src/robot_verification/robot_verification \
            src/stm32_robot_bridge/stm32_robot_bridge/protocol_v3.py \
            src/stm32_robot_bridge/stm32_robot_bridge/bridge_core.py
          mypy tools scripts/verify \
            src/robot_control/robot_control/control_policy.py \
            src/stm32_robot_bridge/stm32_robot_bridge/bridge_state.py \
            src/stm32_robot_bridge/stm32_robot_bridge/protocol_v3.py \
            src/stm32_robot_bridge/stm32_robot_bridge/bridge_core.py \
            src/stm32_robot_bridge/stm32_robot_bridge/serial_transport.py
          yamllint .
          find scripts launch_scripts -type f -name '*.sh' -print0 | \
            xargs -0 shellcheck --severity=error

      - name: Firmware host contract tests
        run: |
          cmake -S firmware-contract/tests/host -B firmware-contract/build-host
          cmake --build firmware-contract/build-host --parallel 2
          ctest --test-dir firmware-contract/build-host --output-on-failure

      - name: Linux software evidence with coverage
        run: |
          . /opt/ros/humble/setup.sh
          python3 scripts/verify/run_software_evidence.py \
            --firmware-root firmware-contract \
            --output-dir build/software-evidence \
            --with-coverage

      - name: Module coverage thresholds
        run: |
          python3 -m coverage json -o coverage.json
          python3 scripts/verify/check_coverage.py coverage.json

      - name: repo boundaries check
        run: python3 scripts/verify/check_repo_boundaries.py

      - name: version and release consistency
        run: python3 scripts/verify/check_version_consistency.py
